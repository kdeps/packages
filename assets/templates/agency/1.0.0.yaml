version: 1.0.0
files:
    README.md.j2: |
        # {{ name }}

        {{ description }}

        ## Structure

        ```
        {{ name }}/
        ├── agency.yaml            # Agency configuration
        └── agents/
            └── example-agent/     # Individual agent
                ├── workflow.yaml  # Agent workflow
                └── resources/     # Agent resources
        ```

        ## Usage

        ```bash
        # Run the agency
        kdeps run agency.yaml

        # Run a specific agent
        kdeps run agents/example-agent/workflow.yaml
        ```

        ## Adding Agents

        1. Create a new directory under `agents/`
        2. Add a `workflow.yaml` to it
        3. List the path in `agency.yaml` under `agents:`
    agency.yaml.j2: |
        apiVersion: kdeps.io/v1
        kind: Agency

        metadata:
          name: {{ name }}
          description: {{ description }}
          version: {{ version }}
          # targetAgentId names the agent that acts as the agency entry point.
          # When kdeps runs this agency, the named agent's workflow is executed first.
          # Other agents are available for inter-agent calls via the `agent` resource type.
          targetAgentId: example-agent

        # List of agent directories (relative to this file).
        # Each entry must contain a workflow.yaml / workflow.yml file.
        # If this list is empty, KDeps auto-discovers agents under the agents/ directory.
        agents:
          - agents/example-agent
    agents/example-agent/workflow.yaml.j2: |
        apiVersion: kdeps.io/v1
        kind: Workflow

        metadata:
          name: example-agent
          description: Example agent in {{ name }}
          version: "{{ version }}"
          targetActionId: response

        settings:
          agentSettings:
            timezone: "UTC"

        resources:
          # Entry-point resource: runs when the agency enters this agent.
          # To call another agent in the agency, add a resource like this and
          # list it under `requires:` below:
          #
          #   - actionId: askHelper
          #     name: Ask helper
          #     agent:
          #       name: helper-agent        # metadata.name of the target agent
          #       params:
          #         greeting: "{% raw %}{{ get('q') }}{% endraw %}"
          - actionId: response
            name: Response
            apiResponse:
              success: true
              response: "Hello from example-agent!"
