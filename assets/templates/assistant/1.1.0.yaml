version: 1.1.0
files:
    README.md.j2: |
        # {{ name }}

        {{ description }}

        A coding assistant as a workflow: `kdeps run` opens a prompt, and each line is one agent turn that can read, edit and run files in the current folder.

        ```bash
        kdeps run workflow.yaml
        ```

        ```text
        > list the go files and fix the failing test
        ...
        > /quit
        ```

        - `resources/assistant.yaml`: the model and the tools the agent may call (`loop.tools`). The default model is `ministral3`, a local 3B llamafile. A 1B model does not call tools.
        - `repl.sessionId` in `workflow.yaml`: the stored conversation. Change it to start a new one.
        - File tools stay inside the folder you run from (or `KDEPS_WORKSPACE_ROOT`).
    resources/assistant.yaml.j2: |
        actionId: assistant
        name: Assistant

        chat:
          model:
            name: ministral3   # local 3B llamafile (3.2 GB), no API key; a 1B model does not call tools. Set backend: and a model for a cloud provider
          context:
            prompt: "{% raw %}{{ input('message') }}{% endraw %}"
          loop:
            # The agent works on the files of the folder you run it from.
            tools: [read_file, edit_file, write_file, list_files, search_local, bash_exec]
            maxRounds: 25
            session: "{% raw %}{{ get('session') }}{% endraw %}"   # the prompt's session: one conversation across lines
    workflow.yaml.j2: |
        apiVersion: kdeps.io/v1
        kind: Workflow

        metadata:
          name: {{ name }}
          description: {{ description }}
          version: "{{ version }}"
          targetActionId: assistant

        deploy:
          input:
            sources: [interactive]   # kdeps run opens a prompt; each line is one turn

        repl:
          prompt: "> "
          sessionId: {{ name }}      # one stored conversation; change it to start a new one
