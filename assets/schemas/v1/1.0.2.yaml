version: 1.0.2
files:
    agency.json: |
        {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "type": "object",
          "required": ["apiVersion", "kind", "metadata"],
          "properties": {
            "apiVersion": {
              "type": "string",
              "enum": ["kdeps.io/v1"]
            },
            "kind": {
              "type": "string",
              "enum": ["Agency"]
            },
            "metadata": {
              "type": "object",
              "required": ["name"],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "description": {
                  "type": "string"
                },
                "version": {
                  "type": "string"
                },
                "targetAgentId": {
                  "type": "string",
                  "minLength": 1,
                  "description": "Name (metadata.name) of the agent that acts as the agency entry point"
                }
              }
            },
            "agents": {
              "type": "array",
              "items": {
                "type": "string",
                "minLength": 1
              }
            }
          },
          "additionalProperties": false
        }
    component.json: |
        {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "type": "object",
          "required": ["apiVersion", "kind", "metadata"],
          "properties": {
            "apiVersion": {
              "type": "string",
              "enum": ["kdeps.io/v1"]
            },
            "kind": {
              "type": "string",
              "enum": ["Component"]
            },
            "metadata": {
              "type": "object",
              "required": ["name"],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "description": {
                  "type": "string"
                },
                "version": {
                  "type": "string"
                },
                "targetActionId": {
                  "type": "string",
                  "minLength": 1,
                  "description": "ActionID of the resource that acts as the component entry point"
                }
              },
              "additionalProperties": false
            },
            "interface": {
              "type": "object",
              "properties": {
                "inputs": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "required": ["name", "type"],
                    "properties": {
                      "name": {
                        "type": "string",
                        "minLength": 1
                      },
                      "type": {
                        "type": "string",
                        "enum": ["string", "integer", "number", "boolean"]
                      },
                      "required": {
                        "type": "boolean"
                      },
                      "description": {
                        "type": "string"
                      },
                      "default": {}
                    },
                    "additionalProperties": false
                  }
                },
                "output": {
                  "description": "The component's result, evaluated after its resources run (expressions resolved, maps and lists walked). Without it the result is the last resource's output."
                }
              },
              "additionalProperties": false
            },
            "pythonPackages": {
              "type": "array",
              "items": {
                "type": "string",
                "minLength": 1
              },
              "description": "Deprecated: use setup.pythonPackages. Python packages merged into workflow agentSettings at load time."
            },
            "setup": {
              "type": "object",
              "properties": {
                "pythonPackages": {
                  "type": "array",
                  "items": { "type": "string", "minLength": 1 },
                  "description": "Python packages installed via 'uv pip install' before component resources run."
                },
                "osPackages": {
                  "type": "array",
                  "items": { "type": "string", "minLength": 1 },
                  "description": "OS packages installed via apt-get/apk/brew before component resources run."
                },
                "provides": {
                  "type": "array",
                  "items": { "type": "string", "minLength": 1 },
                  "description": "Programs the osPackages install (e.g. tesseract). When all are on PATH, the OS package install is skipped."
                },
                "commands": {
                  "type": "array",
                  "items": { "type": "string" },
                  "description": "Shell commands run once before component resources execute."
                }
              },
              "additionalProperties": false
            },
            "teardown": {
              "type": "object",
              "properties": {
                "commands": {
                  "type": "array",
                  "items": { "type": "string" },
                  "description": "Shell commands run after component resources finish executing."
                }
              },
              "additionalProperties": false
            },
            "resources": {
              "type": "array"
            }
          },
          "additionalProperties": false
        }
    resource.json: |
        {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "definitions": {
            "responseBlock": {
              "type": "object",
              "properties": {
                "success": {
                  "type": "boolean"
                },
                "response": {
                  "description": "Response data - can be any type: string, array, object, number, etc."
                },
                "headers": {
                  "type": "object",
                  "description": "HTTP headers for the response"
                },
                "statusCode": {
                  "type": "integer",
                  "description": "HTTP status code for the response"
                },
                "model": {
                  "type": "string"
                },
                "backend": {
                  "type": "string"
                }
              }
            },
            "fieldRule": {
              "type": "object",
              "properties": {
                "type": {
                  "type": "string",
                  "enum": [
                    "string",
                    "integer",
                    "number",
                    "boolean",
                    "array",
                    "object",
                    "email",
                    "url",
                    "uuid",
                    "date"
                  ]
                },
                "minLength": {
                  "type": "integer"
                },
                "maxLength": {
                  "type": "integer"
                },
                "pattern": {
                  "type": "string"
                },
                "min": {
                  "type": "number"
                },
                "max": {
                  "type": "number"
                },
                "minimum": {
                  "type": "number"
                },
                "maximum": {
                  "type": "number"
                },
                "minItems": {
                  "type": "integer"
                },
                "maxItems": {
                  "type": "integer"
                },
                "enum": {
                  "type": "array"
                },
                "message": {
                  "type": "string"
                }
              }
            }
          },
          "type": "object",
          "required": [
            "actionId",
            "name"
          ],
          "properties": {
            "validations": {
              "type": "object",
              "description": "Consolidated validation configuration for the resource",
              "properties": {
                "methods": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "enum": [
                      "GET",
                      "POST",
                      "PUT",
                      "DELETE",
                      "PATCH"
                    ]
                  }
                },
                "routes": {
                  "type": "array",
                  "items": {
                    "type": "string",
                    "pattern": "^/"
                  }
                },
                "headers": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "params": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "skip": {
                  "type": "array",
                  "description": "OR logic: any true condition skips the resource"
                },
                "check": {
                  "type": "array",
                  "description": "AND logic: all must be true or error is returned"
                },
                "error": {
                  "type": "object",
                  "description": "Error returned when check conditions fail",
                  "properties": {
                    "code": {
                      "type": "integer"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                },
                "required": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  },
                  "description": "List of required field names"
                },
                "rules": {
                  "type": "array",
                  "description": "Field-specific validation rules",
                  "items": {
                    "type": "object",
                    "properties": {
                      "field": {
                        "type": "string"
                      },
                      "type": {
                        "type": "string",
                        "enum": [
                          "string",
                          "integer",
                          "number",
                          "boolean",
                          "array",
                          "object",
                          "email",
                          "url",
                          "uuid",
                          "date"
                        ]
                      },
                      "minLength": {
                        "type": "integer"
                      },
                      "maxLength": {
                        "type": "integer"
                      },
                      "pattern": {
                        "type": "string"
                      },
                      "min": {
                        "type": "number"
                      },
                      "max": {
                        "type": "number"
                      },
                      "minimum": {
                        "type": "number"
                      },
                      "maximum": {
                        "type": "number"
                      },
                      "minItems": {
                        "type": "integer"
                      },
                      "maxItems": {
                        "type": "integer"
                      },
                      "enum": {
                        "type": "array"
                      },
                      "message": {
                        "type": "string"
                      }
                    }
                  }
                },
                "properties": {
                  "type": "object",
                  "description": "Alias for rules: map of field name to rule config",
                  "additionalProperties": {
                    "$ref": "#/definitions/fieldRule"
                  }
                },
                "fields": {
                  "type": "object",
                  "description": "Alias for rules: map of field name to rule config",
                  "additionalProperties": {
                    "$ref": "#/definitions/fieldRule"
                  }
                },
                "expr": {
                  "type": "array",
                  "description": "Custom expression-based validation rules (bare scalar strings)",
                  "items": {
                    "type": "string"
                  }
                }
              }
            },
            "loop": {
              "type": "object",
              "description": "Loop iteration config. Repeats the resource body while the optional 'while' expression is true (or indefinitely up to maxIterations when 'while' is omitted). Add 'every' for a fixed inter-iteration delay or 'at' for scheduled fire times.",
              "properties": {
                "while": {
                  "type": "string",
                  "minLength": 1,
                  "description": "Optional boolean expression evaluated before each iteration. Loop continues while truthy. When omitted, the loop runs until maxIterations (default 1000) or until all 'at' entries are consumed."
                },
                "maxIterations": {
                  "type": "integer",
                  "minimum": 1,
                  "description": "Safety cap on the number of iterations (default: 1000)."
                },
                "every": {
                  "anyOf": [
                    {
                      "type": "string",
                      "maxLength": 0
                    },
                    {
                      "type": "string",
                      "pattern": "^[0-9]+(ms|s|m|h)$"
                    }
                  ],
                  "description": "Optional inter-iteration delay (e.g. '1s', '500ms', '2m', '1h'). Mutually exclusive with 'at'."
                },
                "at": {
                  "type": "array",
                  "description": "Array of specific dates/times to fire the loop body. Supported formats: RFC3339 ('2026-03-15T10:00:00Z'), time-of-day ('10:00' or '10:00:00'), or date ('2026-03-15'). Mutually exclusive with 'every'.",
                  "items": {
                    "type": "string",
                    "minLength": 1
                  }
                }
              }
            },
            "chat": {
              "type": "object",
              "properties": {
                "model": {
                  "type": "string",
                  "description": "Model id, \"router\" / \"auto-router\" to delegate to the router, or \"system\" to follow the machine config (~/.kdeps/config.yaml). Empty behaves like \"system\"."
                },
                "backend": {
                  "type": "string",
                  "description": "LLM backend name (openai, anthropic, ollama, file, ...) or \"system\" to follow the machine config. Usually left unset."
                },
                "contextLength": {
                  "type": "integer",
                  "enum": [
                    4096,
                    8192,
                    16384,
                    32768,
                    65536,
                    131072,
                    262144
                  ]
                },
                "role": {
                  "type": "string"
                },
                "prompt": {
                  "type": "string"
                },
                "messages": {
                  "type": "string"
                },
                "scenario": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "role": { "type": "string" },
                      "prompt": { "type": "string" },
                      "name": { "type": "string" },
                      "cacheControl": { "type": "string", "enum": ["ephemeral"] }
                    },
                    "required": ["role", "prompt"]
                  }
                },
                "fewShot": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "role": { "type": "string" },
                      "prompt": { "type": "string" },
                      "name": { "type": "string" },
                      "cacheControl": { "type": "string", "enum": ["ephemeral"] }
                    },
                    "required": ["role", "prompt"]
                  }
                },
                "fewShotSelectK": {
                  "type": "integer",
                  "minimum": 0
                },
                "fewShotMaxTokens": {
                  "type": "integer",
                  "minimum": 0
                },
                "fewShotEmbeddingModel": {
                  "type": "string"
                },
                "fewShotEmbeddingBackend": {
                  "type": "string"
                },
                "tools": {
                  "type": "array"
                },
                "componentTools": {
                  "type": "array",
                  "items": { "type": "string" }
                },
                "files": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "jsonResponse": {
                  "type": "boolean"
                },
                "jsonResponseKeys": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "jsonSchema": {
                  "type": "object"
                },
                "streaming": {
                  "type": "boolean"
                },
                "timeout": {
                  "type": "string"
                },
                "thinking": {
                  "type": "object",
                  "properties": {
                    "mode": {
                      "type": "string",
                      "enum": ["none", "minimal", "low", "medium", "high", "xhigh", "auto"]
                    },
                    "budgetTokens": { "type": "integer", "minimum": 0 },
                    "returnOutput": { "type": "boolean" },
                    "streamThinking": { "type": "boolean" },
                    "interleaveThinking": { "type": "boolean" }
                  }
                },
                "promptCaching": {
                  "type": "boolean"
                },
                "useCache": {
                  "type": "boolean"
                },
                "toolChoice": {
                  "type": "string"
                },
                "maxToolRounds": {
                  "type": "integer",
                  "minimum": 0
                },
                "promptVars": {
                  "type": "object"
                },
                "retrieverContext": {
                  "type": "array",
                  "items": { "type": "string" }
                },
                "retrieverContextTopK": {
                  "type": "integer",
                  "minimum": 0
                },
                "retrieverContextMaxTokens": {
                  "type": "integer",
                  "minimum": 0
                },
                "goTemplate": {
                  "type": "boolean"
                },
                "chainOfThought": {
                  "type": "boolean"
                },
                "outputParser": {
                  "type": "string"
                },
                "chunkSize": {
                  "type": "integer",
                  "minimum": 0
                },
                "chunkOverlap": {
                  "type": "integer",
                  "minimum": 0
                },
                "chunkSplitter": {
                  "type": "string",
                  "enum": ["recursive", "token", "markdown"]
                },
                "temperature": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 2
                },
                "maxTokens": {
                  "type": "integer",
                  "minimum": 1
                },
                "topP": {
                  "type": "number",
                  "minimum": 0,
                  "maximum": 1
                },
                "topK": {
                  "type": "integer",
                  "minimum": 1
                },
                "seed": {
                  "type": "integer"
                },
                "frequencyPenalty": {
                  "type": "number",
                  "minimum": -2,
                  "maximum": 2
                },
                "presencePenalty": {
                  "type": "number",
                  "minimum": -2,
                  "maximum": 2
                },
                "repetitionPenalty": {
                  "type": "number",
                  "minimum": 0
                },
                "stopWords": {
                  "type": "array",
                  "items": { "type": "string" }
                },
                "candidateCount": {
                  "type": "integer",
                  "minimum": 1
                },
                "n": {
                  "type": "integer",
                  "minimum": 1
                },
                "minLength": {
                  "type": "integer",
                  "minimum": 0
                },
                "maxLength": {
                  "type": "integer",
                  "minimum": 1
                },
                "googleCachedContent": {
                  "type": "string"
                },
                "googleHarmThreshold": {
                  "type": "integer",
                  "minimum": 0,
                  "maximum": 4
                },
                "googleCloudProject": {
                  "type": "string"
                },
                "googleCloudLocation": {
                  "type": "string"
                },
                "googleCredentialsJSON": {
                  "type": "string"
                },
                "googleCredentialsFile": {
                  "type": "string"
                },
                "anthropicExtendedOutput": {
                  "type": "boolean"
                },
                "anthropicBetaHeaders": {
                  "type": "array",
                  "items": { "type": "string" }
                },
                "openAILegacyMaxTokens": {
                  "type": "boolean"
                },
                "ollamaThink": {
                  "type": "boolean"
                },
                "ollamaKeepAlive": {
                  "type": "string"
                },
                "ollamaPullModel": {
                  "type": "boolean"
                },
                "ollamaPullTimeout": {
                  "type": "string"
                }
              }
            },
            "httpClient": {
              "type": "object",
              "properties": {
                "url": {
                  "type": "string"
                },
                "method": {
                  "type": "string",
                  "enum": [
                    "GET",
                    "POST",
                    "PUT",
                    "DELETE",
                    "PATCH"
                  ]
                },
                "headers": {
                  "type": "object"
                },
                "body": {
                  "type": "object"
                },
                "accountName": {
                  "type": "string"
                }
              }
            },
            "sql": {
              "type": "object",
              "properties": {
                "connection": {
                  "type": "string"
                },
                "connectionName": {
                  "type": "string"
                },
                "query": {
                  "type": "string"
                },
                "params": {
                  "type": "array"
                },
                "format": {
                  "type": "string",
                  "enum": [
                    "json",
                    "csv",
                    "table"
                  ]
                },
                "maxRows": {
                  "type": "integer"
                },
                "timeout": {
                  "type": "string"
                }
              }
            },
            "python": {
              "type": "object",
              "properties": {
                "script": {
                  "type": "string"
                },
                "file": {
                  "type": "string"
                },
                "scriptFile": {
                  "type": "string"
                },
                "args": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "timeout": {
                  "type": "string"
                },
                "venvName": {
                  "type": "string",
                  "description": "Custom virtual environment name for Python environment isolation"
                }
              }
            },
            "exec": {
              "type": "object",
              "properties": {
                "command": {
                  "type": "string"
                },
                "args": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "timeout": {
                  "type": "string"
                },
                "workingDir": {
                  "type": "string",
                  "description": "Working directory for command execution"
                },
                "env": {
                  "type": "object",
                  "description": "Environment variables",
                  "additionalProperties": {
                    "type": "string"
                  }
                }
              }
            },
            "apiResponse": {
              "$ref": "#/definitions/responseBlock"
            },
            "agent": {
              "type": "object",
              "description": "Invoke another agent within the same agency",
              "required": ["name"],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1,
                  "description": "Name (metadata.name) of the target agent workflow within the agency"
                },
                "params": {
                  "type": "object",
                  "description": "Input parameters forwarded to the target agent (accessible via get('key'))"
                }
              }
            },
            "onError": {
              "type": "object",
              "description": "Error handling configuration for the resource",
              "properties": {
                "action": {
                  "type": "string",
                  "enum": [
                    "continue",
                    "fail",
                    "retry"
                  ],
                  "description": "Action to take when an error occurs: continue (proceed with fallback), fail (stop execution), retry (retry with backoff)"
                },
                "maxRetries": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 10,
                  "description": "Maximum number of retry attempts (only for action: retry)"
