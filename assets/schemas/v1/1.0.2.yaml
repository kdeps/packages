                },
                "when": {
                  "type": "array",
                  "description": "Conditions for when to apply this error handler (has access to 'error' object)"
                }
              }
            },
            "component": {
              "type": "object",
              "required": [
                "name"
              ],
              "additionalProperties": false,
              "properties": {
                "name": {
                  "type": "string",
                  "description": "Name of the component to call"
                },
                "version": {
                  "type": "string",
                  "description": "Pin a specific component version for reproducible builds"
                },
                "with": {
                  "type": "object",
                  "description": "Input values scoped to the calling resource actionId",
                  "additionalProperties": true
                }
              }
            },
            "actionId": {
              "type": "string",
              "minLength": 1
            },
            "name": {
              "type": "string",
              "minLength": 1
            },
            "description": {
              "type": "string"
            },
            "category": {
              "type": "string"
            },
            "requires": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "items": {
              "type": "array",
              "items": {
                "type": "string"
              }
            },
            "apiVersion": {
              "type": "string",
              "enum": [
                "kdeps.io/v1"
              ]
            },
            "kind": {
              "type": "string",
              "enum": [
                "Resource"
              ]
            }
          }
        }
    workflow.json: |
        {
          "$schema": "http://json-schema.org/draft-07/schema#",
          "type": "object",
          "required": [
            "apiVersion",
            "kind",
            "metadata",
            "settings"
          ],
          "properties": {
            "apiVersion": {
              "type": "string",
              "enum": [
                "kdeps.io/v1"
              ]
            },
            "kind": {
              "type": "string",
              "enum": [
                "Workflow"
              ]
            },
            "metadata": {
              "type": "object",
              "required": [
                "name",
                "targetActionId"
              ],
              "properties": {
                "name": {
                  "type": "string",
                  "minLength": 1
                },
                "description": {
                  "type": "string"
                },
                "version": {
                  "type": "string"
                },
                "targetActionId": {
                  "type": "string",
                  "minLength": 1
                }
              }
            },
            "settings": {
              "type": "object",
              "properties": {
                "apiServer": {
                  "type": "object",
                  "properties": {
                    "hostIp": {
                      "type": "string"
                    },
                    "portNum": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 65535
                    },
                    "routes": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "path"
                        ],
                        "properties": {
                          "path": {
                            "type": "string",
                            "pattern": "^/"
                          },
                          "methods": {
                            "type": "array",
                            "items": {
                              "type": "string",
                              "enum": [
                                "GET",
                                "POST",
                                "PUT",
                                "DELETE",
                                "PATCH"
                              ]
                            }
                          }
                        }
                      }
                    }
                  }
                },
                "agentSettings": {
                  "type": "object",
