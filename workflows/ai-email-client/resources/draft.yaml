actionId: draft
name: Draft Reply
# Only runs for the "draft" action. Generates reply text; it does not send.
validations:
  skip:
    - get('action') != 'draft'
chat:
  model: deepseek-chat        # backend: deepseek + deepseek_api_key set in ~/.kdeps/config.yaml
  role: user
  timeout: 120s
  scenario:
    - role: system
      prompt: |
        You draft email replies. Write a complete, ready-to-send reply in the
        requested tone. Match the sender's context. Do not invent facts or
        commitments the user did not authorize. Output only the reply body -
        no subject line, no signature placeholders, no commentary.
  prompt: |
    Reply to this email:
    ---
    From: {{ get('from') }}
    Subject: {{ get('subject') }}

    {{ get('body') }}
    ---
    Tone: {{ get('tone') ?? 'professional' }}
    What I want to say: {{ get('instructions') ?? 'Acknowledge and respond appropriately.' }}
