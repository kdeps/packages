actionId: triage
name: Triage and Organize
requires: [triagePrep, folders]
# Cache-aware: triagePrep already filtered to the not-yet-cached emails. If there
# are none, this resource is skipped entirely (pure cache hit, no LLM call).
validations:
  skip:
    - get('action') not in ['inbox', 'reorganize']
    - safe(output('triagePrep'), 'hasNew') != true
chat:
  model: deepseek-chat        # backend: deepseek + deepseek_api_key set in ~/.kdeps/config.yaml
  role: user
  timeout: 120s
  scenario:
    - role: system
      prompt: |
        You are an email triage assistant. You receive a JSON array of inbox
        messages, each with uid, subject, from, date, and body. For every
        message return an object with:
          - uid: the message uid, unchanged
          - category: one of [action, reply, meeting, newsletter, receipt, spam, fyi]
          - priority: one of [high, medium, low]
          - summary: one concise sentence describing the message
          - folder: the destination folder. PREFER a simple, short,
            content-descriptive category that matches the email: "newsletter",
            "promotions", "action", "fyi", "receipt", "recruitment", "security",
            or a similar plain category word. Reuse a folder from the list below
            when it fits, preferring the simplest matching name; otherwise use a
            short new category name. For clearly specific topics you may use a
            matching specific existing folder (e.g. "GitHub", "Werkspot"). Never
            target "INBOX" or any "[Gmail]/..." folder.
            Existing folders (JSON array):
            {{ json(safe(output('folders'), 'folders') ?? []) }}
        Respond with ONLY a JSON array of these objects. No prose, no markdown.
  prompt: |
    Triage every message in this JSON array:
    {{ json(filter(get('fetch').messages, .UID in output('triagePrep').newUids)) }}
