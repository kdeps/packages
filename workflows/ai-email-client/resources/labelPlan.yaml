actionId: labelPlan
name: Plan Label Cleanup
requires: [folders]
# AI reviews the real folder list and proposes a consolidation plan: merge
# duplicate/near-duplicate folders into a canonical one, and delete stray ones.
validations:
  skip:
    - get('action') != 'labels'
chat:
  model: deepseek-chat
  role: user
  timeout: 120s
  scenario:
    - role: system
      prompt: |
        You find DUPLICATE and near-duplicate folders and consolidate each
        duplicate group into ONE canonical label. You receive a JSON array of
        existing folders.

        ONLY merge folders that mean essentially the SAME thing:
          - case variants: "utilities" vs "Utilities"
          - singular/plural: "newsletter" vs "Newsletters"
          - a nested or verbose label vs a plain label for the SAME concept:
            "Zero Inbox/Newsletters" -> "newsletter",
            "Zero Inbox/Promotions" -> "promotions",
            "Zero Inbox/Purchases" -> "receipt"
          - lowercase junk that twins a real label.

        NEVER merge folders that represent DIFFERENT topics - keep them as-is.
        Do NOT fold distinct labels like "Work", "Startup", "Groceries", "School",
        "Kingdom Hall", "Health", "Debts", "NVIDIA", "Linkedin" into a generic
        bucket. When unsure whether two labels are the same concept, leave them
        separate. Do NOT over-consolidate.

        If a folder has no clear duplicate or obvious simple-category twin, OMIT it
        from the plan entirely - leave it untouched. Only output merges you are
        confident about; a short, high-quality plan is better than a long one.
        Never invent a weak match just to give a folder a target.

        For each duplicate group, choose the canonical "to" = the SIMPLEST,
        shortest, most content-descriptive name. Prefer plain category words like
        "newsletter", "promotions", "action", "fyi", "receipt", "recruitment",
        "security" over verbose or nested names.

        Constraints:
          - Prefer reusing an existing label as "to"; you MAY use a new short
            category name only when it is the natural simple name for a duplicate
            group (it will be created on apply). Reuse as much as possible.
          - Prefer merging over plain deletion whenever a folder may hold mail.
          - NEVER include "INBOX" or any "[Gmail]/..." folder in from/to/deletes.
          - PROTECTED labels must NEVER appear as a merge "from" or in "deletes"
            (they may be a merge "to"). Protected labels (JSON array):
            {{ get('protectedLabels', 'session') ?? '[]' }}

        merges: move everything from the messy folder INTO the clean canonical one,
        then delete the messy folder. deletes: only clearly stray folders with no
        good merge target.

        Return ONLY JSON:
        {"merges":[{"from":"...","to":"...","reason":"..."}],
         "deletes":[{"folder":"...","reason":"..."}]}
        No prose, no markdown.
  prompt: |
    Existing folders:
    {{ json(safe(output('folders'), 'folders') ?? []) }}
