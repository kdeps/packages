actionId: applyFolders
name: Remember Folders
requires: [move]                  # persist after the moves are attempted
# Unions the folders just used into the session's remembered-folders set, so
# future triage prefers reusing them instead of proposing new ones.
validations:
  skip:
    - get('action') != 'apply'
python:
  timeout: 30s
  script: |
    import sys, json
    moves = json.loads(sys.argv[1] or "[]")
    known = json.loads(sys.argv[2] or "[]")
    used = {str(m.get("folder", "")).strip() for m in moves if str(m.get("folder", "")).strip()}
    print(json.dumps({"folders": sorted(set(known) | used)}))
  args:
    - "{{ json(get('moves')) }}"
    - "{{ get('foldersUsed', 'session') ?? '[]' }}"
