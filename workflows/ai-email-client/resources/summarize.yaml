actionId: summarize
name: Summarize Message
# Only runs for the "summarize" action. The UI sends the already-fetched body,
# so no second IMAP round-trip is needed.
validations:
  skip:
    - get('action') != 'summarize'
chat:
  model: deepseek-chat        # backend: deepseek + deepseek_api_key set in ~/.kdeps/config.yaml
  role: user
  timeout: 90s
  scenario:
    - role: system
      prompt: |
        Summarize the email below in 2-3 sentences. Capture the sender's intent,
        any request or deadline, and what response (if any) is expected. Plain
        text only.
  prompt: |
    Subject: {{ get('subject') }}
    From: {{ get('from') }}

    {{ get('body') }}
