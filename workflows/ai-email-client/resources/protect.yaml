actionId: protect
name: Set Protected Labels
# Persists the user's protected-labels list to the session. Protected labels are
# never merged away or deleted by the label-cleanup feature (they may still be a
# merge TARGET). Send {action:'protect', labels:[...]} to replace the list.
validations:
  skip:
    - get('action') != 'protect'
after:
  - set('protectedLabels', json(get('labels') ?? []), 'session')
exec:
  command: "true"              # no-op; the work is the after: persistence above
