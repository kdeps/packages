actionId: mergeMove
name: Merge Folder Contents
requires: [labelApplyPrep]
# Runs once per merge: moves ALL mail from the source folder into the target.
# search.since=1970 reliably matches every message in the source (empty search
# is not portable). An empty source folder simply moves nothing.
validations:
  skip:
    - get('action') != 'labelsApply'
items:
  - "{{ safe(output('labelApplyPrep'), 'moves') }}"
email:
  action: modify
  imapConnection: inbox
  mailbox: "{{ get('current').from }}"
  search:
    since: "1970-01-01"          # matches all mail in the source folder
  modify:
    moveTo: "{{ get('current').to }}"
  timeout: 120s
