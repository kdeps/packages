actionId: persistFolders
name: Persist Remembered Folders
requires: [applyFolders]
# Writes the unioned folder set to the session (separate resource because a
# resource cannot read its own output inside its own after: hook).
validations:
  skip:
    - get('action') != 'apply'
after:
  - set('foldersUsed', json(safe(output('applyFolders'), 'folders') ?? []), 'session')
exec:
  command: "true"              # no-op; the work is the after: persistence above
