actionId: folders
name: List Mailbox Folders
# Lists the account's real IMAP folders so triage proposes existing folders
# (true reuse) instead of inventing names that may not exist or collide with
# reserved Gmail categories.
validations:
  skip:
    - get('action') not in ['inbox', 'reorganize', 'labels']
email:
  action: list
  imapConnection: inbox
  timeout: 30s
