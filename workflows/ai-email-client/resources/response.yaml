actionId: response
name: API Response
requires: [persistCache, summarize, draft, send, persistFolders, labelPlan, labelDelete, protect, unsubGet, unsubPost]   # skipped branches are silent no-ops
apiResponse:
  success: true
  response:
    action: "{{ get('action') }}"
    # Wrapped in {{ }} so safe()/output() route through expr-lang. safe() yields
    # nil for a skipped branch, so only the fields for the current action fill in.
    inbox: "{{ safe(output('triageMerge'), 'items') }}"       # triaged list (uid,category,priority,summary,folder)
    messages: "{{ safe(output('fetch'), 'messages') }}"       # full messages (uid,from,subject,body,unsubscribe*) for the unified view
    plan: "{{ safe(output('triageMerge'), 'items') }}"        # same list; folder = proposed target (action=reorganize)
    summary: "{{ safe(output('summarize'), 'message.content') }}" # summary text    (action=summarize)
    draft: "{{ safe(output('draft'), 'message.content') }}"       # drafted reply   (action=draft)
    sent: "{{ output('send') }}"                              # {success,...}      (action=send)
    moved: "{{ output('move') }}"                             # per-move IMAP results (action=apply)
    folders: "{{ safe(output('applyFolders'), 'folders') }}"  # remembered folder set after apply
    labelPlan: "{{ safe(output('labelPlan'), 'message.content') }}"  # {merges,deletes} cleanup plan (action=labels)
    labelMerges: "{{ safe(output('labelApplyPrep'), 'moves') }}"     # merges executed  (action=labelsApply)
    labelDeletes: "{{ safe(output('labelApplyPrep'), 'deletes') }}"  # folders deleted  (action=labelsApply)
    protected: "{{ fromJSON(get('protectedLabels', 'session') ?? '[]') }}"  # current protected list (labels/protect)
    subscriptions: "{{ filter(safe(output('fetch'), 'messages') ?? [], .UnsubscribeURL != '') }}"  # senders with an unsubscribe link (action=unsubscribe)
    unsubscribed: "{{ output('unsubGet') }}"                                 # GET results        (action=unsubApply)
    unsubscribedOneClick: "{{ output('unsubPost') }}"                        # one-click POST results (action=unsubApply)
