apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: ai-email-client
  version: "1.0.0"
  description: "Organize, triage, draft, and summarize your inbox with a web UI"
  targetActionId: response      # single terminal resource; branches gate themselves by action

settings:
  # HTTP API - authenticated with a bearer token (KDEPS_API_AUTH_TOKEN).
  apiServer:
    hostIp: "127.0.0.1"
    portNum: 16395
    routes:
      - path: /api/v1/mail
        methods: [POST]         # one route; the "action" field in the body selects the behavior

  # Browser UI - static files served from the SAME port as the API (portNum
  # omitted => merges onto 16395). Same-origin, so the page's fetch() needs no
  # CORS and is not blocked by the browser's cross-origin/local-network rules.
  webServer:
    routes:
      - path: /
        serverType: static
        publicPath: ./public

  # Persistent per-browser state. The triage cache lives here, keyed by the
  # kdeps_session_id cookie, so already-triaged emails are not re-sent to the LLM.
  session:
    type: sqlite              # persists to ~/.kdeps/sessions.db (survives restarts)
    ttl: 24h

  agentSettings:
    timezone: UTC
    pythonVersion: "3.12"     # the cache-merge and move-grouping resources run Python
