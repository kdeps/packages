<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Email Client</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --line: rgba(255,255,255,0.08);
    --text: #e6e9ef; --text-2: #9aa4b2; --text-3: #6b7280; --accent: #00e5ff;
    --high: #ff2d78; --med: #ffd60a; --low: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", -apple-system, system-ui, sans-serif; }
  code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px;
    border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  header .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  header input { width: 210px; padding: 7px 10px; border-radius: 2px;
    border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--text);
    font-family: "JetBrains Mono", monospace; font-size: 12px; }
  header .spacer { margin-left: auto; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 24px; border-bottom: 1px solid var(--line); }
  .toolbar .status { color: var(--text-3); font-size: 12px; margin-left: auto; }
  .imgtoggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); cursor: pointer; }
  main { padding: 20px 24px; max-width: 920px; }
  button.action { padding: 9px 16px; border-radius: 2px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); cursor: pointer; font-size: 13px;
    transition: transform .15s, background .15s; }
  button.action:hover { transform: translateY(-2px); background: rgba(0,229,255,0.08); }
  button.action:disabled { opacity: .4; cursor: default; transform: none; }
  button.mini { padding: 5px 9px; border-radius: 2px; border: 1px solid var(--line);
    background: transparent; color: var(--text-2); cursor: pointer; font-size: 12px;
    transition: color .15s, border-color .15s; }
  button.mini:hover { border-color: var(--accent); color: var(--accent); }
  textarea, .fld { width: 100%; padding: 9px; border-radius: 2px; border: 1px solid var(--line);
    background: rgba(0,0,0,0.25); color: var(--text); font-size: 13px;
    font-family: inherit; resize: vertical; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-3); margin-top: 10px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .row > div { flex: 1; }
  .card { border: 1px solid var(--line); border-radius: 2px; padding: 12px 14px; margin: 10px 0;
    background: var(--panel); }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-family: "JetBrains Mono", monospace; font-size: 10px; text-transform: uppercase;
    padding: 2px 7px; border-radius: 8px; letter-spacing: .04em; }
  .badge.high { background: rgba(255,45,120,.15); color: var(--high); }
  .badge.medium { background: rgba(255,214,10,.15); color: var(--med); }
  .badge.low { background: rgba(107,114,128,.2); color: var(--low); }
  .cat { border: 1px solid var(--line); color: var(--text-2); }
  .from { font-weight: 600; font-size: 13px; }
  .subject { color: var(--text-2); font-size: 13px; }
  .summary { margin: 8px 0 0; font-size: 13px; color: var(--text-2); }
  .card-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .folder-inp { width: 150px; padding: 5px 8px; font-size: 12px; margin: 0;
    font-family: "JetBrains Mono", monospace; }
  .expand { margin-top: 10px; display: none; }
  .expand.open { display: block; }
  .orig-frame { width: 100%; height: 440px; border: 1px solid var(--line); border-radius: 2px; background: #fff; }
  .orig-pre { max-height: 440px; overflow: auto; margin: 0; padding: 10px;
    border: 1px solid var(--line); border-radius: 2px; background: rgba(0,0,0,0.2); }
  .out { white-space: pre-wrap; font-size: 13px; line-height: 1.5; }
  .hint { color: var(--text-3); font-size: 12px; }
  .err { color: var(--high); font-size: 13px; }
  .ok { color: var(--accent); font-size: 13px; }
  .section { border: 1px solid var(--line); border-radius: 2px; margin: 18px 0;
    background: var(--panel); }
  .section > .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    cursor: pointer; }
  .section > .head h2 { font-size: 13px; margin: 0; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-2); }
  .section > .body { display: none; padding: 0 14px 14px; }
  .section.open > .body { display: block; }
  .section .caret { color: var(--text-3); font-size: 11px; }
  .label-merge, .label-del, .sub-inline { display: flex; align-items: center; gap: 10px;
    padding: 6px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
  <header>
    <span class="dot"></span>
    <h1>AI Email Client</h1>
    <span class="spacer"></span>
    <input id="from-addr" placeholder="Your email (for sending)" />
    <input id="token" type="password" placeholder="Bearer token" />
  </header>

  <div class="toolbar">
    <button class="action" onclick="refresh()">Refresh inbox</button>
    <button class="mini" onclick="applyAllMoves()">Apply all folder moves</button>
    <button class="mini" onclick="toggleSection('sec-labels')">Label cleanup</button>
    <button class="mini" onclick="scanUnsub()">Find subscriptions</button>
    <label class="imgtoggle" title="Off blocks remote images/tracking pixels in Original view">
      <input type="checkbox" id="load-images" /> Load remote images
    </label>
    <span class="status" id="status"></span>
  </div>

  <main>
    <div id="inbox"></div>

    <!-- LABEL CLEANUP (collapsible) -->
    <section class="section" id="sec-labels">
      <div class="head" onclick="toggleSection('sec-labels')">
        <h2>Label cleanup</h2><span class="caret">toggle</span>
      </div>
      <div class="body">
        <label>Protected labels (comma-separated) - never merged away or deleted</label>
        <div class="row">
          <div><input class="fld" id="protected-input" style="margin:0" placeholder="Work, Health, IC2026, Debts" /></div>
          <div style="flex:0 0 auto; align-self:flex-end"><button class="mini" onclick="saveProtected()">Save</button></div>
        </div>
        <div id="protected-msg" class="hint" style="margin:6px 0 12px"></div>
        <button class="action" onclick="loadLabelPlan()">Preview cleanup plan</button>
        <div id="label-out" style="margin-top:12px"></div>
        <div id="label-actions" style="display:none; margin-top:12px">
          <button class="action" onclick="applyLabels()">Apply checked cleanup</button>
        </div>
        <div id="label-result" class="out" style="margin-top:10px"></div>
      </div>
    </section>

    <!-- SUBSCRIPTIONS (collapsible, populated by Find subscriptions) -->
    <section class="section" id="sec-unsub">
      <div class="head" onclick="toggleSection('sec-unsub')">
        <h2>Subscriptions</h2><span class="caret">toggle</span>
      </div>
      <div class="body">
        <div id="subs-out"><p class="hint">Click "Find subscriptions" above to scan the inbox.</p></div>
        <div id="subs-actions" style="display:none; margin-top:12px">
          <button class="action" onclick="unsubscribeChecked()">Unsubscribe from checked</button>
        </div>
        <div id="unsub-result" class="out" style="margin-top:10px"></div>
      </div>
    </section>
  </main>

<script>
  const API = "/api/v1/mail";
  const tokenEl = document.getElementById("token");
  const fromEl = document.getElementById("from-addr");
  tokenEl.value = localStorage.getItem("kdeps_token") || "";
  fromEl.value = localStorage.getItem("kdeps_from") || "";
  tokenEl.addEventListener("input", () => localStorage.setItem("kdeps_token", tokenEl.value));
  fromEl.addEventListener("input", () => localStorage.setItem("kdeps_from", fromEl.value));
  const imgEl = document.getElementById("load-images");
  imgEl.checked = localStorage.getItem("kdeps_load_images") === "1";
  imgEl.addEventListener("change", onToggleImages);

  let EMAILS = {};   // uid -> merged {uid, from, subject, body, category, priority, summary, folder, unsubscribeUrl, unsubscribeOneClick}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
  function setStatus(s) { document.getElementById("status").textContent = s; }
  function asItems(v) {
    if (typeof v === "string") { const s = v.trim().replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, ""); try { return JSON.parse(s); } catch (_) { return null; } }
    return v;
  }
  function toggleSection(id) { document.getElementById(id).classList.toggle("open"); }

  async function call(payload) {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + tokenEl.value },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " - " + (await res.text()));
    return res.json();
  }

  // ---- Unified inbox ----
  async function refresh() {
    const box = document.getElementById("inbox");
    box.innerHTML = '<p class="hint">Fetching and triaging...</p>';
    setStatus("working...");
    try {
      const j = await call({ action: "inbox" });
      const triage = asItems(j.data.inbox) || [];
      const msgs = j.data.messages || [];
      const tByUid = {}; triage.forEach(t => tByUid[t.uid] = t);
      EMAILS = {};
      const order = msgs.length ? msgs : triage;
      order.forEach(m => {
        const t = tByUid[m.uid] || {};
        EMAILS[m.uid] = {
          uid: m.uid, from: m.from || "", subject: m.subject || "", body: m.body || "",
          category: t.category || m.category || "", priority: t.priority || m.priority || "low",
          summary: t.summary || m.summary || "", folder: t.folder || m.folder || t.category || "",
          unsubscribeUrl: m.unsubscribeUrl || "", unsubscribeOneClick: !!m.unsubscribeOneClick
        };
      });
      renderInbox();
      setStatus(Object.keys(EMAILS).length + " emails");
    } catch (e) { box.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; setStatus("error"); }
  }

  function renderInbox() {
    const box = document.getElementById("inbox");
    const list = Object.values(EMAILS);
    if (!list.length) { box.innerHTML = '<p class="hint">Inbox empty.</p>'; return; }
    box.innerHTML = list.map(m => `
      <div class="card" id="card-${m.uid}">
        <div class="card-top">
          <span class="badge ${esc(m.priority)}">${esc(m.priority || "?")}</span>
          <span class="badge cat">${esc(m.category || "?")}</span>
          ${m.unsubscribeUrl ? '<span class="badge low">sub</span>' : ''}
          <span class="from">${esc(m.from)}</span>
          <span class="subject">${esc(m.subject)}</span>
          <span class="card-actions">
            <input class="fld folder-inp" id="folder-${m.uid}" value="${esc(m.folder)}" title="destination folder" />
            <button class="mini" onclick="moveCard(${m.uid})">Move</button>
            <button class="mini" onclick="toggleExpand(${m.uid},'orig')">Original</button>
            <button class="mini" onclick="toggleExpand(${m.uid},'sum')">Summarize</button>
            <button class="mini" onclick="toggleExpand(${m.uid},'draft')">Draft</button>
            ${m.unsubscribeUrl ? `<button class="mini" onclick="unsubCard(${m.uid})">Unsub</button>` : ''}
          </span>
        </div>
        <p class="summary">${esc(m.summary)}</p>
        <div class="expand" id="orig-${m.uid}"></div>
        <div class="expand" id="sum-${m.uid}"><div class="out" id="sum-out-${m.uid}"></div></div>
        <div class="expand" id="draft-${m.uid}">
          <div class="row">
            <div><label>What to say</label><input class="fld" id="d-inst-${m.uid}" placeholder="Agree, propose Thursday 2pm..." /></div>
            <div style="flex:0 0 120px"><label>Tone</label><input class="fld" id="d-tone-${m.uid}" placeholder="professional" /></div>
            <div style="flex:0 0 auto; align-self:flex-end"><button class="mini" onclick="draftCard(${m.uid})">Generate</button></div>
          </div>
          <textarea id="d-out-${m.uid}" rows="6" placeholder="Draft appears here; edit then Send"></textarea>
          <div class="row"><div style="flex:0 0 auto"><button class="mini" onclick="sendCard(${m.uid})">Send reply</button></div>
            <div class="out" id="d-msg-${m.uid}"></div></div>
        </div>
      </div>`).join("");
  }

  function toggleExpand(uid, which) {
    ["orig", "sum", "draft"].forEach(w => {
      const el = document.getElementById(w + "-" + uid);
      if (w === which) el.classList.toggle("open"); else el.classList.remove("open");
    });
  }

  // Wrap email HTML with a CSP that blocks all remote content by default; the
  // "Load remote images" toggle relaxes only img-src/media-src. Scripts, frames,
  // objects, and remote styles/fonts stay blocked regardless.
  function imagesAllowed() { const el = document.getElementById("load-images"); return el && el.checked; }
  function withCSP(html) {
    const media = imagesAllowed() ? "data: https: http:" : "data:";
    const csp = "default-src 'none'; img-src " + media +
      "; media-src " + media + "; style-src 'unsafe-inline'; font-src data:";
    return '<meta http-equiv="Content-Security-Policy" content="' + csp + '">' + html;
  }

  // Render the original email lazily on first open: HTML in a script-blocked
  // sandboxed iframe (with the remote-content CSP), plain text in a scroll box.
  function renderOriginal(uid) {
    const el = document.getElementById("orig-" + uid);
    if (!el.classList.contains("open") || el.dataset.loaded) return;
    el.dataset.loaded = "1";
    const body = EMAILS[uid].body || "(no body)";
    if (/<[a-z!][\s\S]*>/i.test(body)) {
      const f = document.createElement("iframe");
      f.className = "orig-frame";
      f.setAttribute("sandbox", "");           // no scripts, no forms, no same-origin
      f.srcdoc = withCSP(body);
      el.appendChild(f);
    } else {
      const pre = document.createElement("pre");
      pre.className = "out orig-pre";
      pre.textContent = body;
      el.appendChild(pre);
    }
  }

  // Re-render any open Original view when the image toggle changes.
  function onToggleImages() {
    localStorage.setItem("kdeps_load_images", imagesAllowed() ? "1" : "0");
    document.querySelectorAll("[id^='orig-'].expand.open").forEach(el => {
      el.dataset.loaded = ""; el.innerHTML = "";
      renderOriginal(el.id.slice(5));
    });
  }

  async function moveCard(uid) {
    const folder = document.getElementById("folder-" + uid).value.trim();
    if (!folder) return;
    setStatus("moving...");
    try {
      await call({ action: "apply", moves: [{ uid: Number(uid), folder }] });
      const card = document.getElementById("card-" + uid);
      card.style.opacity = ".4";
      setStatus("moved " + uid + " -> " + folder);
    } catch (e) { setStatus("error"); alert(e.message); }
  }

  async function applyAllMoves() {
    const moves = Object.values(EMAILS).map(m => {
      const f = (document.getElementById("folder-" + m.uid) || {}).value;
      return f && f.trim() ? { uid: Number(m.uid), folder: f.trim() } : null;
    }).filter(Boolean);
    if (!moves.length) { setStatus("no folders set"); return; }
    if (!confirm("Move " + moves.length + " emails into their folders?")) return;
    setStatus("moving " + moves.length + "...");
    try { await call({ action: "apply", moves }); setStatus("moved " + moves.length); refresh(); }
    catch (e) { setStatus("error"); alert(e.message); }
  }

  async function summarizeCardBody(uid) {
    const m = EMAILS[uid];
    const j = await call({ action: "summarize", from: m.from, subject: m.subject, body: m.body });
    return j.data.summary || "(no output)";
  }
  async function draftCard(uid) {
    const m = EMAILS[uid];
    const out = document.getElementById("d-out-" + uid); out.value = "Drafting...";
    try {
      const j = await call({ action: "draft", from: m.from, subject: m.subject, body: m.body,
        tone: document.getElementById("d-tone-" + uid).value,
        instructions: document.getElementById("d-inst-" + uid).value });
      out.value = j.data.draft || "(no output)";
    } catch (e) { out.value = ""; document.getElementById("d-msg-" + uid).innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }
  async function sendCard(uid) {
    const m = EMAILS[uid];
    const msg = document.getElementById("d-msg-" + uid);
    const body = document.getElementById("d-out-" + uid).value;
    if (!body.trim()) { msg.innerHTML = '<span class="err">Draft first.</span>'; return; }
    let subject = m.subject; if (subject && !/^re:/i.test(subject)) subject = "Re: " + subject;
    msg.textContent = "Sending...";
    try {
      const j = await call({ action: "send", to: m.from, from: fromEl.value, subject, body });
      msg.innerHTML = (j.data.sent && j.data.sent.success) ? '<span class="ok">Sent</span>' : '<span class="err">Send failed</span>';
    } catch (e) { msg.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }

  // lazy-load summary when expanding
  const _origToggle = toggleExpand;
  toggleExpand = function (uid, which) {
    _origToggle(uid, which);
    if (which === "orig") renderOriginal(uid);
    if (which === "sum") {
      const el = document.getElementById("sum-" + uid);
      const out = document.getElementById("sum-out-" + uid);
      if (el.classList.contains("open") && !out.dataset.loaded) {
        out.textContent = "Summarizing..."; out.dataset.loaded = "1";
        summarizeCardBody(uid).then(s => out.textContent = s).catch(e => { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; out.dataset.loaded = ""; });
      }
    }
  };

  async function unsubCard(uid) {
    const m = EMAILS[uid];
    if (!m.unsubscribeUrl) return;
    if (!confirm("Unsubscribe from " + m.from + "?")) return;
    setStatus("unsubscribing...");
    try {
      const j = await call({ action: "unsubApply", targets: [{ url: m.unsubscribeUrl, oneClick: m.unsubscribeOneClick }] });
      const r = [].concat(j.data.unsubscribed || [], j.data.unsubscribedOneClick || [])[0];
      setStatus("unsubscribe " + (r && r.statusCode ? r.statusCode : "sent"));
    } catch (e) { setStatus("error"); alert(e.message); }
  }

  // ---- Subscriptions bulk ----
  async function scanUnsub() {
    document.getElementById("sec-unsub").classList.add("open");
    const out = document.getElementById("subs-out");
    document.getElementById("subs-actions").style.display = "none";
    out.innerHTML = '<p class="hint">Scanning...</p>';
    try {
      const j = await call({ action: "unsubscribe" });
      const subs = (j.data.subscriptions || []).filter(s => s.unsubscribeUrl);
      if (!subs.length) { out.innerHTML = '<p class="hint">No unsubscribe links found.</p>'; return; }
      out.innerHTML = subs.map(s => `
        <div class="sub-inline" data-url="${esc(s.unsubscribeUrl)}" data-oneclick="${s.unsubscribeOneClick ? 1 : 0}">
          <input type="checkbox" class="sub-cb" checked />
          ${s.unsubscribeOneClick ? '<span class="badge low">1-click</span>' : ''}
          <span style="flex:1; font-size:13px">${esc(s.from)}</span>
          <span style="flex:1; font-size:12px; color:var(--text-2)">${esc(s.subject)}</span>
        </div>`).join("");
      document.getElementById("subs-actions").style.display = "block";
    } catch (e) { out.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
  }
  async function unsubscribeChecked() {
    const out = document.getElementById("unsub-result");
    const targets = [];
    document.querySelectorAll("#subs-out .sub-inline").forEach(r => {
      if (r.querySelector(".sub-cb").checked) targets.push({ url: r.dataset.url, oneClick: r.dataset.oneclick === "1" });
    });
    if (!targets.length) { out.innerHTML = '<span class="err">Nothing checked.</span>'; return; }
    out.textContent = "Unsubscribing from " + targets.length + "...";
    try {
      const j = await call({ action: "unsubApply", targets });
      const results = [].concat(j.data.unsubscribed || [], j.data.unsubscribedOneClick || []);
      const ok = results.filter(r => r && r.statusCode >= 200 && r.statusCode < 400).length;
      out.innerHTML = '<span class="ok">Sent ' + targets.length + ', ' + ok + ' succeeded (2xx/3xx).</span>';
    } catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }

  // ---- Label cleanup ----
  async function saveProtected() {
    const msg = document.getElementById("protected-msg");
    const labels = document.getElementById("protected-input").value.split(",").map(s => s.trim()).filter(Boolean);
    try { const j = await call({ action: "protect", labels }); msg.innerHTML = '<span class="ok">Protected: ' + esc((j.data.protected || []).join(", ") || "(none)") + '</span>'; }
    catch (e) { msg.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }
  async function loadLabelPlan() {
    const out = document.getElementById("label-out"), actions = document.getElementById("label-actions");
    document.getElementById("label-result").textContent = ""; actions.style.display = "none";
    out.innerHTML = '<p class="hint">Analyzing folders...</p>';
    try {
      const j = await call({ action: "labels" });
      const prot = j.data.protected || [];
      if (prot.length && !document.getElementById("protected-input").value.trim())
        document.getElementById("protected-input").value = prot.join(", ");
      const plan = asItems(j.data.labelPlan) || {};
      const merges = plan.merges || [], deletes = plan.deletes || [];
      if (!merges.length && !deletes.length) { out.innerHTML = '<p class="hint">No duplicates found.</p>'; return; }
      out.innerHTML =
        merges.map(m => `<div class="label-merge">
          <input type="checkbox" class="merge-cb" checked />
          <input class="fld merge-from" style="width:150px;margin:0" value="${esc(m.from)}" readonly />
          <span class="hint">-&gt;</span>
          <input class="fld merge-to" style="width:170px;margin:0" value="${esc(m.to)}" />
          <span style="flex:1;font-size:12px;color:var(--text-3)">${esc(m.reason || "")}</span></div>`).join("") +
        deletes.map(d => `<div class="label-del">
          <input type="checkbox" class="del-cb" checked />
          <span class="badge high">delete</span>
          <input class="fld del-folder" style="width:170px;margin:0" value="${esc(d.folder)}" readonly />
          <span style="flex:1;font-size:12px;color:var(--text-3)">${esc(d.reason || "")}</span></div>`).join("");
      actions.style.display = "block";
    } catch (e) { out.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; }
  }
  async function applyLabels() {
    const out = document.getElementById("label-result");
    const merges = [], deletes = [];
    document.querySelectorAll("#label-out .label-merge").forEach(r => {
      if (!r.querySelector(".merge-cb").checked) return;
      const from = r.querySelector(".merge-from").value.trim(), to = r.querySelector(".merge-to").value.trim();
      if (from && to) merges.push({ from, to });
    });
    document.querySelectorAll("#label-out .label-del").forEach(r => {
      if (r.querySelector(".del-cb").checked) { const f = r.querySelector(".del-folder").value.trim(); if (f) deletes.push({ folder: f }); }
    });
    if (!merges.length && !deletes.length) { out.innerHTML = '<span class="err">Nothing checked.</span>'; return; }
    out.textContent = "Applying...";
    try {
      const j = await call({ action: "labelsApply", merges, deletes });
      out.innerHTML = '<span class="ok">Merged: ' + esc((j.data.labelMerges || []).map(m => m.from + "->" + m.to).join(", ") || "none") +
        '<br>Deleted: ' + esc((j.data.labelDeletes || []).join(", ") || "none") + '</span>';
    } catch (e) { out.innerHTML = '<span class="err">' + esc(e.message) + '</span>'; }
  }

  if (tokenEl.value) refresh();
</script>
</body>
</html>
